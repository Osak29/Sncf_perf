name: Pipeline ETL SNCF Automatisé

# Déclencheurs du pipeline
on:
  push:
    branches: [ "main" ] # S'exécute à chaque push sur la branche main
  schedule:
    - cron: '0 6 * * 1' # S'exécute automatiquement chaque lundi à 6h00 UTC

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupération du code source du dépôt
    - name: Checkout du code
      uses: actions/checkout@v4

    # 2. Configuration de l'environnement Python
    - name: Configuration de Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Installation des dépendances
    - name: Installation des packages Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Exécution du script ETL avec passage des secrets
    - name: Exécution du script ETL
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: python main.py